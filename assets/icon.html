<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 512px; height: 512px; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; }
      .icon {
        position: relative;
        width: 448px;
        height: 448px;
        display: grid;
        place-items: center;
        border-radius: 116px;
        color: #082219;
        font-size: 188px;
        background:
          radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.78), transparent 20%),
          linear-gradient(145deg, #9effd0 0%, #58e6a8 48%, #9b80ff 100%);
        box-shadow:
          inset 0 4px 2px rgba(255, 255, 255, 0.72),
          inset 0 -10px 26px rgba(47, 21, 126, 0.2),
          0 24px 48px rgba(0, 0, 0, 0.28);
      }
      .icon::after {
        content: "";
        position: absolute;
        inset: 18px;
        border: 2px solid rgba(255, 255, 255, 0.34);
        border-radius: 98px;
      }
      i { filter: drop-shadow(0 12px 20px rgba(9, 50, 36, 0.2)); }
    </style>
  </head>
  <body>
    <div class="icon"><i class="fa-solid fa-satellite-dish"></i></div>
  </body>
</html>
